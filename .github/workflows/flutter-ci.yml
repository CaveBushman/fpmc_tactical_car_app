name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Analyze, test, and build web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tactical-mesh-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  backend:
    name: Backend (Django) check and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tactical
          POSTGRES_USER: tactical
          POSTGRES_PASSWORD: tactical
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tactical" --health-interval 5s
          --health-retries 10

    env:
      SESSION_SECRET: ci-session-secret-0123456789abcdefghij
      LIVEKIT_URL: wss://livekit.ci
      LIVEKIT_API_KEY: ci-key
      LIVEKIT_API_SECRET: ci-livekit-secret-0123456789abcdef

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check and migrations up to date
        run: |
          python manage.py check --deploy --fail-level ERROR
          python manage.py makemigrations --check --dry-run

      - name: Migrate against PostgreSQL
        env:
          POSTGRES_DB: tactical
          POSTGRES_USER: tactical
          POSTGRES_PASSWORD: tactical
          POSTGRES_HOST: localhost
        run: python manage.py migrate --noinput

      - name: Test
        run: python manage.py test

  backend-e2e:
    name: App client against the Django backend (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tactical
          POSTGRES_USER: tactical
          POSTGRES_PASSWORD: tactical
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tactical" --health-interval 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        run: flutter pub get

      - name: End-to-end
        env:
          PYTHON: python
          POSTGRES_DB: tactical
          POSTGRES_USER: tactical
          POSTGRES_PASSWORD: tactical
          POSTGRES_HOST: localhost
        run: tool/e2e_backend.sh

  meshtastic-schema:
    name: Meshtastic schema conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Fetches protoc and the GPL-3.0 Meshtastic .proto files into a temp
      # directory; nothing derived from them is committed.
      - name: Check decoder fields against the official schema
        run: tool/check_meshtastic_schema.sh
