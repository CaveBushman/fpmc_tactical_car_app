{% extends "panel/base.html" %}
{% block title %}Moje heslo{% endblock %}
{% block content %}
<h1>Změna mého hesla</h1>
<form method="post" class="card">
  {% csrf_token %}
  {{ form.as_div }}
  <p class="muted">Po změně se aplikace na všech vašich zařízeních musí přihlásit znovu.</p>
  <button type="submit">Změnit heslo</button>
</form>
{% endblock %}
