<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Panel velitele{% endblock %} · FPMC Tactical</title>
<style>
  :root { --bg:#12160f; --panel:#1d2418; --line:#3a4430; --text:#e8e4d4;
          --muted:#a8a58f; --accent:#4b5320; --sand:#c2b280; --danger:#e2504c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.45 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:4px 16px; align-items:center;
           padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header strong { margin-right:auto; letter-spacing:.04em; }
  nav a { color:var(--sand); margin-right:12px; text-decoration:none; font-weight:600; }
  nav a.active { color:var(--text); text-decoration:underline; }
  main { padding:16px; max-width:1100px; margin:0 auto; }
  h1 { font-size:22px; margin:8px 0 16px; }
  h2 { font-size:17px; margin:24px 0 8px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  a { color:var(--sand); }
  .wrap { overflow-x:auto; }
  .muted { color:var(--muted); font-size:13px; }
  .tag { display:inline-block; padding:1px 6px; border:1px solid var(--line);
         border-radius:4px; margin:1px 2px 1px 0; font-size:12px; }
  .off { color:var(--danger); font-weight:700; }
  form.inline { display:inline; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:14px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin:10px 0 4px; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width:100%; max-width:420px; padding:8px; background:#0c0f0a; color:var(--text);
    border:1px solid var(--line); border-radius:6px; font:inherit; }
  ul.checks { list-style:none; padding:0; margin:0; }
  ul.checks label, .check label { display:inline; font-weight:400; }
  .helptext { display:block; color:var(--muted); font-size:12px; }
  button, .button { display:inline-block; padding:8px 14px; border:0; border-radius:6px;
           background:var(--accent); color:#fff; font:inherit; font-weight:700;
           cursor:pointer; text-decoration:none; margin-top:10px; }
  button.secondary { background:#33402a; }
  button.danger { background:var(--danger); }
  .messages { list-style:none; padding:0; }
  .messages li { padding:8px 12px; border-radius:6px; margin-bottom:8px; background:#24301d; }
  .messages li.error, .errorlist { color:#fff; background:#5a1f1d; }
  .errorlist { list-style:none; padding:6px 10px; border-radius:6px; }
</style>
</head>
<body>
<header>
  <strong>FPMC Tactical · panel velitele</strong>
  {% if user.is_authenticated %}
  <nav>
    <a href="{% url 'panel-users' %}" {% if section == 'users' %}class="active"{% endif %}>Uživatelé</a>
    <a href="{% url 'panel-groups' %}" {% if section == 'groups' %}class="active"{% endif %}>Skupiny</a>
    <a href="{% url 'panel-audit' %}" {% if section == 'audit' %}class="active"{% endif %}>Audit</a>
  </nav>
  <form class="inline" method="post" action="{% url 'panel-logout' %}">
    {% csrf_token %}<span class="muted">{{ user.username }}</span>
    <button class="secondary" type="submit">Odhlásit</button>
  </form>
  {% endif %}
</header>
<main>
  {% if messages %}
  <ul class="messages">{% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}</ul>
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
