# Minimal LiveKit config; API keys come from LIVEKIT_KEYS (docker-compose).
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: true
room:
  # Rooms are created on join and closed shortly after the last member leaves.
  empty_timeout: 300
  max_participants: 50
logging:
  level: info
# For networks that block UDP add a TURN server, see
# https://docs.livekit.io/home/self-hosting/deployment/
