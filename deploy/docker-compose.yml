# PTT stack: LiveKit SFU + Django backend (API for the app and the
# commanders' web panel) + PostgreSQL.
# 1. cp .env.example .env and fill in secrets
# 2. docker compose up -d
# 3. docker compose exec backend python manage.py create_commander <name>
#    (moving from the former Dart server instead: copy its data directory
#    and run `python manage.py import_dart_data /path/to/data`)
# Put a TLS reverse proxy (Caddy/Traefik/nginx) in front: the app needs
# wss:// for LiveKit and https:// for the backend; the panel is at
# https://<host>/panel/.
services:
  livekit:
    image: livekit/livekit-server:v1.13
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tactical
      POSTGRES_USER: tactical
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tactical -d tactical"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      POSTGRES_DB: tactical
      POSTGRES_USER: tactical
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      ALLOWED_HOSTS: ${PUBLIC_HOST}
      CSRF_TRUSTED_ORIGINS: https://${PUBLIC_HOST}
      # Only reachable through the local TLS proxy, which sets
      # X-Forwarded-For / -Proto; used for rate limiting, audit and HTTPS.
      TRUST_PROXY: "1"
      FORWARDED_ALLOW_IPS: "*"
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
    healthcheck:
      # /health also checks the database; unhealthy -> Docker restarts it.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Daily housekeeping: old audit entries and expired panel sessions.
  maintenance:
    build: ../backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          python manage.py prune_audit
          python manage.py clearsessions
          sleep 86400
        done
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      POSTGRES_DB: tactical
      POSTGRES_USER: tactical
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}

  # Nightly pg_dump into ./backups, kept for BACKUP_KEEP_DAYS (default 14).
  # Restore: docker compose exec -T db pg_restore -U tactical -d tactical \
  #            --clean --if-exists < backups/tactical-YYYYMMDD-HHMM.dump
  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: tactical
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: tactical
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          file=/backups/tactical-$$(date +%Y%m%d-%H%M).dump
          if pg_dump --format=custom --file="$$file.tmp"; then
            mv "$$file.tmp" "$$file"
            echo "backup $$file"
          else
            rm -f "$$file.tmp"
            echo "backup FAILED" >&2
          fi
          find /backups -name 'tactical-*.dump' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done

volumes:
  db-data:
